[project]
name = "langgraph-tute"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.5.1",
    "chromadb>=1.5.9",
    "grandalf>=0.8",
    "groq>=0.37.1",
    "isort>=8.0.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.10",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.27",
    "tiktoken>=0.13.0",
]

[project.scripts]
langgraph-tute = "langgraph_tute:main"

[build-system]
