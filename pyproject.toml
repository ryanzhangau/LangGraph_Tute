[project]
name = "langgraph-tute"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "grandalf>=0.8",
    "groq>=0.37.1",
    "isort>=8.0.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.2",
]

[project.scripts]
langgraph-tute = "langgraph_tute:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
